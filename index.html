    --border: #2a3d4a; --primary: #5fb3bb; --primary-fg: #0b2228; --ring: #5fb3bb;
    --ok-bg: #052e16; --ok-fg: #bbf7d0; --warn-bg: #451a03; --warn-fg: #fde68a;
    --err-bg: #450a0a; --err-fg: #fecaca; --info-bg: #172554; --info-fg: #bfdbfe;
  }
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
.mono { font-family: var(--mono); }
.small { font-size: 12px; }
.muted { color: var(--muted-fg); }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 12px; z-index: 50; background: var(--bg); padding: 8px 12px; border-radius: 6px; }

.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-bottom: 1px solid var(--brand-bar); background: var(--brand-bar); color: var(--brand-fg); }
.logo { display: block; width: 32px; height: 32px; }
.brand { font-weight: 600; font-size: 14px; }

.page { max-width: 1280px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.lookup .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.grow { flex: 1; min-width: 240px; }
label { font-size: 12px; font-weight: 500; }
.input { height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); font-size: 14px; }
select.input { min-width: 200px; }
.btn { height: 40px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font-weight: 500; cursor: pointer; font-size: 13px; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.btn.sm { height: 32px; padding: 0 12px; }
.btn:disabled { opacity: .6; cursor: progress; }
.err { color: var(--err-dot); margin: 8px 0 0; font-size: 13px; }
.extras { margin-top: 10px; }
.extras summary { cursor: pointer; font-size: 12px; font-weight: 500; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 10px; }

.progress { display: flex; align-items: center; gap: 12px; }
.bar { width: 360px; height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; }
#bar-fill { height: 100%; width: 0; background: var(--primary); transition: width .15s; }

#results { display: flex; flex-direction: column; gap: 20px; outline: none; }
.intro { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px; border: 1px dashed var(--border); border-radius: 8px; }
.intro h2 { font-size: 14px; margin: 0; }
.intro p { margin: 4px 0 0; font-size: 12px; color: var(--muted-fg); }

.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.head h1 { margin: 0; font-size: 18px; }
.head .meta { font-size: 12px; font-weight: 400; color: var(--muted-fg); margin-left: 8px; }
.actions { display: flex; gap: 8px; }

.overview { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; }
figure { margin: 0; min-width: 0; }
figcaption, .h2 { font-size: 13px; font-weight: 500; margin: 0 0 8px; }
.map { border: 1px solid var(--border); border-radius: 8px; background: var(--card); overflow-x: auto; }
.map svg { width: 100%; min-width: 640px; display: block; }
.map text { font-family: inherit; }
.findings { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; }
.findings li + li { border-top: 1px solid var(--border); }
.findings button { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 12px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.findings button:hover { background: var(--muted); }
.findings .k { font-weight: 500; }

.badge { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid transparent; }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.badge.success { background: var(--ok-bg); color: var(--ok-fg); } .badge.success .dot { background: var(--ok-dot); }
.badge.warning { background: var(--warn-bg); color: var(--warn-fg); } .badge.warning .dot { background: var(--warn-dot); }
.badge.error { background: var(--err-bg); color: var(--err-fg); } .badge.error .dot { background: var(--err-dot); }
.badge.info { background: var(--info-bg); color: var(--info-fg); } .badge.info .dot { background: var(--info-dot); }
.badge.neutral { background: var(--muted); color: var(--fg); } .badge.neutral .dot { background: var(--none-dot); }
@media (forced-colors: active) { .badge { border-color: CanvasText; } .badge .dot { background: CanvasText !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.tabsbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 8px; background: var(--muted); }
.tabs button { border: 0; background: none; color: var(--muted-fg); padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.panel { display: flex; flex-direction: column; gap: 16px; margin-top: 12px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted-fg); padding: 8px; border-bottom: 1px solid var(--border); }
td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:hover td { background: color-mix(in srgb, var(--muted) 50%, transparent); }
.val { font-family: var(--mono); font-size: 12px; word-break: break-all; }
.sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }

.cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 { margin: 0; font-size: 14px; }
.code { margin: 8px 0 0; padding: 8px; border-radius: 6px; background: var(--muted); font-family: var(--mono); font-size: 12px; word-break: break-all; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 8px 0 0; font-family: var(--mono); font-size: 12px; }
.kv dt { font-weight: 600; } .kv dd { margin: 0; word-break: break-all; }
.incl { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12px; }
.incl li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }

.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 14px; border-radius: 8px; background: var(--fg); color: var(--bg); font-size: 13px; }

@media (max-width: 1000px) { .overview, .cards2, .grid2 { grid-template-columns: 1fr; } .intro { grid-template-columns: 1fr 1fr; } }
.w-name { width: 24%; } .w-type { width: 64px; } .w-ttl { width: 104px; } .w-res { width: 22%; } .w-svc { width: 200px; }
.ttl { white-space: nowrap; word-break: normal; }

.site-footer { flex: none; width: 100%; max-width: 1280px; margin: 0 auto; padding: 16px 20px 20px; border-top: 1px solid var(--border); font: 400 12px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; letter-spacing: normal; color: var(--muted-fg); text-align: center; }
body { min-height: 100vh; display: flex; flex-direction: column; } .page { flex: 1; width: 100%; }
</style>
</head>

  const ENDPOINTS = { "8.8.8.8": "https://dns.google/resolve", "1.1.1.1": "https://cloudflare-dns.com/dns-query" };
  const TYPE_NAME = { 1: "A", 2: "NS", 5: "CNAME", 6: "SOA", 15: "MX", 16: "TXT", 28: "AAAA", 33: "SRV", 257: "CAA" };

  }

  const TYPE_NUM = { A: 1, NS: 2, CNAME: 5, SOA: 6, MX: 15, TXT: 16, AAAA: 28, SRV: 33, CAA: 257 };

    for (const l of labels) { const b = new TextEncoder().encode(l); bytes.push(b.length, ...b); }

    while (guard++ < 128) {

      if ((len & 0xc0) === 0xc0) { if (!jumped) end = off + 2; off = ((len & 0x3f) << 8) | v.getUint8(off + 1); jumped = true; continue; }

      return decodeMessage(await res.arrayBuffer());

    }
  }

    }
  }

    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.append(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove();

    }
  }

  }
  window.dnsApi = { query, copy, saveFile };
})();

<script>
/* Domain DNS Checker — Domain Health report.
 * Builds a self-contained, printable HTML report from a lookup result.
 * Exposes window.DnsHealthReport = { assess, buildHtml, fileName }.
 * Every DNS value is untrusted text and is HTML-escaped before output. */
"use strict";
(() => {
  const COMPANY = "Macnamara ICT Limited";

  const esc = (v) => String(v ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  const fmtDate = (iso) => new Date(iso).toLocaleString("en-GB", {
    day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short",
  });

  /* ------------------------------------------------------------------ */
  /* Assessment: one row per check, status pass | warn | fail | info     */
  /* ------------------------------------------------------------------ */
  function assess(r, A) {
    const items = [];
    const add = (area, check, status, finding, action) => items.push({ area, check, status, finding, action: action || "" });
    const get = (id) => r.results.find((x) => x.id === id);
    const group = (g) => r.results.filter((x) => x.group === g);
    const has = (x) => x && (x.values.length > 0 || x.cnames.length > 0);

    /* Lookup reliability */
    const failed = r.results.filter((x) => x.status === -1);
    if (failed.length) {
      add("Lookup", "Query failures", "fail", `${failed.length} of ${r.results.length} lookups failed (${failed.slice(0, 5).map((x) => x.name).join(", ")}${failed.length > 5 ? ", …" : ""}).`,
        "Results for these names are incomplete. Re-run the check, or try a different resolver.");
    }

    /* Mail delivery */
    const mx = get("mx");
    const isM365 = r.mxProviders.some((p) => /Microsoft 365/.test(p)) || r.verifications.some((v) => v.service === "Microsoft 365");
    if (mx.status !== -1) {
      if (!mx.values.length) add("Email", "MX records", "fail", "No MX records found. The domain cannot receive email.", "Publish MX records for your mail provider (Microsoft 365: <tenant>.mail.protection.outlook.com).");
      else if (mx.values.some((v) => /^0\s+\.?$/.test(v.trim()))) add("Email", "MX records", "info", "Null MX published: the domain explicitly does not accept email.", "No action needed if this domain should not receive email.");
      else add("Email", "MX records", "pass", `${mx.values.length} MX record${mx.values.length > 1 ? "s" : ""}: ${r.mxProviders.join(", ")}.`);
    }

    /* SPF */
    const spf = r.spf;
    if (!spf.records.length) {
      add("Email", "SPF", "fail", "No SPF record found. Receiving servers cannot verify who may send as this domain.",
        isM365 ? "Publish a TXT record on the domain: v=spf1 include:spf.protection.outlook.com -all (add any other sending services)." : "Publish a TXT record starting v=spf1 listing every service that sends as this domain, ending in -all or ~all.");
    } else {
      if (spf.records.length > 1) add("Email", "SPF: single record", "fail", `${spf.records.length} SPF records found. Multiple SPF records make SPF fail (permerror).`, "Merge them into one v=spf1 record.");
      else add("Email", "SPF: single record", "pass", "One SPF record published.");
      if (spf.lookups > 10) add("Email", "SPF: DNS lookups", "fail", `${spf.lookups} DNS lookups. The limit is 10; SPF fails (permerror) above it.`, "Remove unused includes, or flatten some includes to IP ranges.");
      else if (spf.lookups >= 8) add("Email", "SPF: DNS lookups", "warn", `${spf.lookups} of 10 DNS lookups used.`, "Close to the limit; adding another service may break SPF.");
      else add("Email", "SPF: DNS lookups", "pass", `${spf.lookups} of 10 DNS lookups used.`);
      const q = spf.all ? spf.all[0] : "";
      if (!spf.all && !/redirect=/i.test(spf.records[0])) add("Email", "SPF: enforcement", "warn", "No all mechanism. Unlisted senders get a neutral result.", "End the record with -all (or ~all while testing).");
      else if (q === "-") add("Email", "SPF: enforcement", "pass", "Hard fail (-all): unlisted senders fail SPF.");
      else if (q === "~") add("Email", "SPF: enforcement", "pass", "Soft fail (~all): unlisted senders are marked suspicious.", "Optional: move to -all once every sender is listed. With DMARC enforced, ~all is acceptable.");
      else if (q === "?") add("Email", "SPF: enforcement", "warn", "Neutral (?all): SPF gives no protection.", "Change to ~all or -all.");
      else if (q === "+" || /^all$/i.test(spf.all || "")) add("Email", "SPF: enforcement", "fail", "+all allows any server in the world to pass SPF.", "Change to -all or ~all immediately.");
      const unknown = spf.includes.filter((i) => !i.service).map((i) => i.domain);
      add("Email", "SPF: authorised senders", "info", `${spf.services.length ? spf.services.join(", ") : "No recognised services"}${unknown.length ? `; also ${unknown.join(", ")}` : ""}.`, "Check every listed service is still in use; remove any that are not.");
    }

    /* DMARC */
    const dm = r.dmarc;
    const dmRow = get("dmarc");
    if (dmRow.status !== -1) {
      if (!dm.records.length) {
        add("Email", "DMARC", "fail", "No DMARC record at _dmarc." + r.domain + ". Spoofed mail is not blocked and you receive no reports.", `Publish a TXT record at _dmarc.${r.domain}: v=DMARC1; p=none; rua=mailto:<reports address>, then move to quarantine/reject.`);
      } else if (dm.records.length > 1) {
        add("Email", "DMARC", "fail", `${dm.records.length} DMARC records found; receivers ignore DMARC when there is more than one.`, "Keep a single v=DMARC1 record.");
      } else {
        const p = (dm.tags.p || "").toLowerCase();
        if (p === "reject") add("Email", "DMARC policy", "pass", "p=reject: mail failing DMARC is rejected.");
        else if (p === "quarantine") add("Email", "DMARC policy", "pass", "p=quarantine: mail failing DMARC goes to junk.", "Consider p=reject once reports show all legitimate mail passes.");
        else if (p === "none") add("Email", "DMARC policy", "warn", "p=none: monitoring only, spoofed mail is still delivered.", "Review DMARC reports, then move to p=quarantine and p=reject.");
        else add("Email", "DMARC policy", "fail", "Missing or invalid p= tag.", "Set p=none, quarantine or reject.");
        if (dm.tags.pct && dm.tags.pct !== "100") add("Email", "DMARC coverage", "warn", `pct=${dm.tags.pct}: the policy applies to only ${dm.tags.pct}% of failing mail.`, "Raise pct to 100 (or remove it).");
        if (!dm.tags.rua) add("Email", "DMARC reporting", "warn", "No rua= address: you receive no aggregate reports.", "Add rua=mailto:<address> to see who sends as your domain.");
        else add("Email", "DMARC reporting", "pass", `Aggregate reports sent to ${dm.tags.rua}.`);
        if (dm.tags.sp && dm.tags.sp.toLowerCase() === "none" && p !== "none") add("Email", "DMARC subdomain policy", "warn", "sp=none: subdomains are not protected.", "Remove sp= or set it to quarantine/reject.");
      }
    }

    /* DKIM */
    const dkim = group("dkim");
    const keys = dkim.filter((x) => x.tone === "success");
    const broken = dkim.filter((x) => x.tone === "warning");
    if (keys.length) add("Email", "DKIM keys", "pass", `${keys.length} key${keys.length > 1 ? "s" : ""} found: ${keys.map((k) => `${k.label} (${k.service})`).join(", ")}.`);
    else add("Email", "DKIM keys", "warn", `No DKIM keys found on the ${dkim.length} common selectors checked.`, "Enable DKIM signing for each sending service. Services with custom selectors may not be detected; add them under Extra selectors.");
    for (const b of broken) add("Email", `DKIM ${b.label}`, "warn", `${b.name}: ${b.verdict}.`, /^selector[12]$/.test(b.label) ? "Microsoft 365 DKIM is not enabled. Turn it on in the Defender portal (Email authentication settings > DKIM)." : "Fix the record or remove it if the service is no longer used.");
    if (isM365) {
      const m365Keys = keys.filter((k) => /^selector[12]$/.test(k.label));
      if (!m365Keys.length && !broken.some((b) => /^selector[12]$/.test(b.label))) add("Microsoft 365", "DKIM selectors", "warn", "No selector1/selector2 CNAMEs. Microsoft 365 mail is not DKIM-signed with this domain.", "Create the two CNAMEs shown in the Defender portal, then enable DKIM.");
    }

    /* Microsoft 365 records */
    const m365 = group("m365");
    const needs = { autodiscover: "warn", enterpriseenrollment: "info", enterpriseregistration: "info", lyncdiscover: "info", sip: "info", "sip-tls": "info", sipfed: "info" };
    const why = {
      autodiscover: "Outlook uses this to find the mailbox. Create CNAME autodiscover → autodiscover.outlook.com.",
      enterpriseenrollment: "Only needed for Intune MDM enrollment. CNAME → enterpriseenrollment-s.manage.microsoft.com.",
      enterpriseregistration: "Only needed for Entra device registration. CNAME → enterpriseregistration.windows.net.",
      lyncdiscover: "Only needed for Teams/Skype federation in some hybrid setups.",
      sip: "Only needed for Teams/Skype federation in some hybrid setups.",
      "sip-tls": "Only needed for Teams/Skype federation in some hybrid setups.",
      sipfed: "Only needed for Teams/Skype federation in some hybrid setups.",
    };
    if (isM365) {
      for (const x of m365) {
        if (x.status === -1) continue;
        if (x.tone === "success") add("Microsoft 365", x.label, "pass", `${x.name} points to the Microsoft value.`);
        else if (x.tone === "warning") add("Microsoft 365", x.label, "warn", `${x.name} points to ${[...x.cnames, ...x.values].join(", ")}, not the Microsoft value.`, why[x.id]);
        else add("Microsoft 365", x.label, needs[x.id] || "info", `${x.name} not published.`, why[x.id]);
      }
    } else {
      const found = m365.filter(has);
      add("Microsoft 365", "Tenant records", "info", found.length ? `Mail is not routed to Microsoft 365, but ${found.length} Microsoft 365 record${found.length > 1 ? "s are" : " is"} published (${found.map((x) => x.label).join(", ")}).` : "Mail is not routed to Microsoft 365; Microsoft 365 records not checked further.", found.length ? "Remove leftover records if Microsoft 365 is no longer used." : "");
    }

    /* Transport security */
    const mta = get("mta-sts"), tls = get("tls-rpt"), bimi = get("bimi");
    add("Email", "MTA-STS", has(mta) ? "pass" : "info", has(mta) ? "Published: senders must use TLS to deliver mail." : "Not published. Mail delivery can be downgraded to unencrypted.", has(mta) ? "" : "Optional hardening: publish _mta-sts TXT plus the policy file at https://mta-sts." + r.domain + "/.well-known/mta-sts.txt.");
    add("Email", "TLS-RPT", has(tls) ? "pass" : "info", has(tls) ? "Published: you receive TLS delivery failure reports." : "Not published.", has(tls) ? "" : "Optional: publish _smtp._tls TXT v=TLSRPTv1; rua=mailto:<address>.");
    if (has(bimi)) add("Email", "BIMI", "pass", "Published: supporting mailboxes can show your logo.");

    /* DNS and website */
    const ns = get("ns");
    if (ns.status !== -1) {
      if (!ns.values.length) add("DNS", "Name servers", "fail", "No NS records returned.", "Check the domain registration and delegation.");
      else if (ns.values.length < 2) add("DNS", "Name servers", "warn", `Only one name server (${ns.values[0]}).`, "Use at least two name servers for resilience.");
      else add("DNS", "Name servers", "pass", `${ns.values.length} name servers${r.nsProviders.length ? ` (${r.nsProviders.join(", ")})` : ""}.`);
    }
    const a = get("a"), www = get("www"), aaaa = get("aaaa"), caa = get("caa");
    add("Website", "Apex address", a.values.length ? "pass" : "warn", a.values.length ? `${r.domain} resolves to ${a.values.join(", ")}.` : `${r.domain} has no A record; https://${r.domain} will not load.`, a.values.length ? "" : "Add an A record (or ALIAS) if the bare domain should load the website.");
    if (www.tone === "error") add("Website", "www", "fail", `www.${r.domain}: ${www.verdict}.`, "Fix or remove the record.");
    else add("Website", "www", has(www) && (www.values.length || www.cnames.length) ? "pass" : "warn", has(www) ? `www.${r.domain} resolves${www.service ? ` via ${www.service}` : ""}.` : `www.${r.domain} does not resolve.`, has(www) ? "" : "Add a www record if visitors may type www.");
    add("Website", "IPv6", aaaa.values.length ? "pass" : "info", aaaa.values.length ? `IPv6 address published (${aaaa.values.join(", ")}).` : "No IPv6 (AAAA) address.", "");
    add("Website", "CAA", caa.values.length ? "pass" : "info", caa.values.length ? `Certificate issuance restricted: ${caa.values.join("; ")}.` : "No CAA record; any certificate authority may issue certificates.", caa.values.length ? "" : "Optional: publish CAA records naming the CAs you use.");

    /* Subdomains */
    const subs = group("subdomains");
    const dangling = subs.filter((x) => x.tone === "error");
    const orphan = subs.filter((x) => x.tone === "warning");
    const cloud = subs.filter((x) => x.tone === "info");
    for (const d of dangling) add("Subdomains", d.label, "fail", `${d.name} → ${d.cnames[d.cnames.length - 1] || ""}: target does not exist. This can allow subdomain takeover.`, "Delete the CNAME, or re-create the resource it points to.");
    for (const o of orphan) add("Subdomains", o.label, "warn", `${o.name} → ${o.cnames[o.cnames.length - 1] || ""}: target has no address.`, "Check the service is still in use; remove the record if not.");
    for (const c of cloud) add("Subdomains", c.label, "info", `${c.name} → ${c.cnames[c.cnames.length - 1] || ""} (${c.service || "cloud service"}).`, "Confirm the resource still exists and is yours.");
    if (!dangling.length && !orphan.length) add("Subdomains", "Dangling records", "pass", `No dangling CNAMEs among ${subs.length} common subdomains checked.`);

    /* Verification tokens */
    if (r.verifications.length) {
      const counts = {};
      for (const v of r.verifications) counts[v.service] = (counts[v.service] || 0) + 1;
      add("DNS", "Verification tokens", "info", `${r.verifications.length} token${r.verifications.length > 1 ? "s" : ""}: ${Object.entries(counts).map(([s, n]) => (n > 1 ? `${s} ×${n}` : s)).join(", ")}.`, "Remove tokens for services you no longer use; they show which services the domain is linked to.");
    }

    const order = { fail: 0, warn: 1, pass: 2, info: 3 };
    const summary = { pass: 0, warn: 0, fail: 0, info: 0 };
    for (const i of items) summary[i.status]++;
    return { items, summary, order };
  }

  /* ------------------------------------------------------------------ */
  /* HTML                                                                */
  /* ------------------------------------------------------------------ */
  const LABEL = { pass: "Pass", warn: "Warning", fail: "Fail", info: "Info" };

  function buildHtml(r, A, logoDataUri, companyLogoUri) {
    if (companyLogoUri === undefined && typeof window !== "undefined") companyLogoUri = window.COMPANY_LOGO;
    const { items, summary, order } = assess(r, A);
    const when = fmtDate(r.ranAt);
    const resolver = A.resolverLabel(r.resolver);
    const year = new Date(r.ranAt).getFullYear();
    const title = `Domain Health Report – ${r.domain} – ${when} – ${resolver}`;
    const overall = summary.fail ? "fail" : summary.warn ? "warn" : "pass";
    const overallText = summary.fail ? "Problems found" : summary.warn ? "Improvements recommended" : "Healthy";
    const actions = items.filter((i) => (i.status === "fail" || i.status === "warn") && i.action).sort((x, y) => order[x.status] - order[y.status]);
    const areas = [...new Set(items.map((i) => i.area))];

    const badge = (s) => `<span class="badge ${s}"><span class="dot" aria-hidden="true"></span>${LABEL[s]}</span>`;

    const recordRows = (A.GROUPS || []).map((g) => {
      const rows = r.results.filter((x) => x.group === g.id && (x.values.length || x.cnames.length));
      if (!rows.length) return "";
      return `<h3>${esc(g.label)}</h3>
<table class="records"><thead><tr><th scope="col">Name</th><th scope="col">Type</th><th scope="col">Value</th><th scope="col">TTL</th></tr></thead><tbody>
${rows.map((x) => {
        const lines = [
          ...x.cnames.map((c, i) => [`CNAME → ${esc(c)}`, (x.cnameTtls || [])[i]]),
          ...x.values.map((v, i) => [v, (x.ttls || [])[i]]).filter(([v]) => !(x.type === "CNAME" && x.cnames.includes(v))).map(([v, t]) => [esc(v), t]),
        ];
        const ttl = (t) => (typeof t === "number" ? `<span title="${t} seconds">${esc(A.formatTtl ? A.formatTtl(t) : t + "s")}</span>` : "—");
        return `<tr><td class="mono">${esc(x.name)}</td><td class="mono">${esc(x.type)}</td><td class="mono">${lines.map((l) => `<div>${l[0]}</div>`).join("")}</td><td class="mono ttl">${lines.map((l) => `<div>${ttl(l[1])}</div>`).join("")}</td></tr>`;
      }).join("\n")}
</tbody></table>`;
    }).join("\n");

    const missing = r.results.filter((x) => !x.values.length && !x.cnames.length && x.status !== -1 && x.group !== "dkim" && x.group !== "subdomains");

    return `<!doctype html>

<body>
<header class="band"><div class="wrap">
${logoDataUri ? `<img src="${logoDataUri}" alt="">` : ""}

</div>
${companyLogoUri && /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(companyLogoUri) ? `<img class="company" src="${companyLogoUri}" alt="${COMPANY}" width="232" height="34">` : ""}
</div></header>
<main class="wrap">

<section aria-labelledby="sum-h">

<div class="overview">
<div class="tile overall ${overall}"><div class="n">${overallText}</div><div class="l">${items.length} checks</div></div>
<div class="tile"><div class="n">${summary.fail}</div><div class="l">${badge("fail")}</div></div>
<div class="tile"><div class="n">${summary.warn}</div><div class="l">${badge("warn")}</div></div>

<section aria-labelledby="act-h">

${actions.length ? `<ol class="actions">${actions.map((i) => `<li>${badge(i.status)} <strong>${esc(i.area)} – ${esc(i.check)}:</strong> ${esc(i.action)}</li>`).join("\n")}</ol>` : `<p>No failures or warnings. No action required.</p>`}
</section>

${items.filter((i) => i.area === area).sort((x, y) => order[x.status] - order[y.status]).map((i) => `<tr><td class="status">${badge(i.status)}</td><td class="check">${esc(i.check)}</td><td>${esc(i.finding)}${i.action ? `<div class="action">${esc(i.action)}</div>` : ""}</td></tr>`).join("\n")}
</tbody></table>`).join("\n")}
</section>

<section aria-labelledby="rec-h">

${recordRows || "<p>No records found.</p>"}
${missing.length ? `<h3>Not found</h3><p class="mono">${missing.map((x) => `${esc(x.name)} (${esc(x.type)})`).join(", ")}</p>` : ""}
<p class="note">TTLs are as reported by ${esc(resolver)}: the time left before its cached copy expires, so they can be lower than the TTL set on the record. DKIM selectors and subdomains are checked against common names only; services using custom selectors or hostnames may not appear.</p>
</section>
</main>
<footer class="site-footer">Copyright ${year} ${COMPANY}</footer>
</body>
</html>`;
  }

  const fileName = (r) => `Domain-Health-${r.domain}-${r.ranAt.slice(0, 10)}.html`;

  window.DnsHealthReport = { assess, buildHtml, fileName };
})();

<script>
/* Domain DNS Checker — renderer UI. All text is set via textContent (never innerHTML). */
"use strict";
(() => {
  const A = window.DnsAnalysis;
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);

  /* ---------- DOM helpers ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, String(v));
    for (const kid of kids.flat()) if (kid != null) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  const clip = (t, n = 120) => (t.length > n ? `${t.slice(0, n)}…` : t);
  const TONE_LABEL = { success: "OK", warning: "Check", error: "Problem", info: "Note", neutral: "None" };
  const TONE_STROKE = { success: "#16a34a", warning: "#f59e0b", error: "#dc2626", info: "#2563eb", neutral: "#94a3ab" };
  const badge = (tone, text) =>
    h("span", { class: `badge ${tone}` }, h("span", { class: "dot", "aria-hidden": "true" }), h("span", { class: "sr-only" }, `${TONE_LABEL[tone]}: `), text);

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
  }

  /* ---------- state ---------- */
  const state = { report: null, tab: "mail", showEmpty: false, running: false };

  /* ---------- form setup ---------- */
  const resolverSel = $("resolver");
  for (const r of A.RESOLVERS) resolverSel.append(h("option", { value: r.id }, r.label));
  resolverSel.value = "google";
  $("sel-label").textContent = `Additional DKIM selectors (${A.DKIM_SELECTORS.length} checked by default)`;
  $("hosts-label").textContent = `Additional subdomains (${A.SUBDOMAIN_HOSTS.length} checked by default)`;

  const splitList = (t) => t.split(/[\s,;]+/).map((x) => x.trim().toLowerCase()).filter((x) => /^[a-z0-9_-]+(\.[a-z0-9_-]+)*$/.test(x));
  const isIp = (t) => /^(\d{1,3}\.){3}\d{1,3}$/.test(t) || /^[0-9a-f:]+:[0-9a-f:]*$/i.test(t);

  function showError(msg) {
    const e = $("domain-err");
    e.textContent = msg || ""; e.hidden = !msg;
    $("domain").setAttribute("aria-invalid", msg ? "true" : "false");
  }

  $("lookup").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (state.running) return;
    const domain = A.normaliseDomain($("domain").value);
    if (!A.isValidDomain(domain)) return showError("Enter a domain such as contoso.com");
    let server = "";
    if (resolverSel.value === "custom") {
      server = $("custom-ip").value.trim();
      if (!isIp(server)) return showError("Enter a valid resolver IP address");
    } else server = A.RESOLVERS.find((r) => r.id === resolverSel.value).ip;
    showError("");
    $("domain").value = domain;

    state.running = true;
    $("run").disabled = true; $("run").textContent = "Checking…";
    $("progress").hidden = false;
    try {
      const report = await A.runReport(domain, server, splitList($("sel").value), splitList($("hosts").value), (done, total) => {
        $("bar-fill").style.width = `${total ? Math.round((done / total) * 100) : 0}%`;
        $("progress-text").textContent = `${done} / ${total} queries`;
      });
      state.report = report;
      const failed = report.results.filter((x) => x.status === -1).length;
      if (failed === report.results.length) toast(`Could not reach ${A.resolverLabel(server)}. Try the other resolver.`);
      render();
      $("results").focus();
    } catch (e) {
      toast(`Lookup failed: ${e && e.message ? e.message : e}`);
    } finally {
      state.running = false;
      $("run").disabled = false; $("run").textContent = "Check DNS";
      $("progress").hidden = true;
    }
  });

  /* ---------- findings ---------- */
  function findings(r) {
    const by = (g) => r.results.filter((x) => x.group === g);
    const dkimOn = by("dkim").filter((x) => x.tone === "success");
    const dkimHalf = by("dkim").filter((x) => x.tone === "warning");
    const m365 = by("m365");
    const m365Ok = m365.filter((x) => x.tone === "success").length;
    const m365Off = m365.filter((x) => x.tone === "warning").length;
    const dangling = by("subdomains").filter((x) => x.tone === "error" && x.cnames.length);
    const mx = r.results.find((x) => x.id === "mx");
    const sec = by("security").filter((x) => x.tone === "success").map((x) => x.label.split(" ")[0]);
    const failed = r.results.filter((x) => x.status === -1).length;
    const list = [
      { label: "MX", tone: mx.tone, text: r.mxProviders.length ? r.mxProviders.join(", ") : mx.verdict, tab: "mail" },
      { label: "SPF", tone: r.spf.tone, text: r.spf.records.length ? `${r.spf.verdict} · ${r.spf.lookups}/10 lookups` : r.spf.verdict, tab: "mail" },
      { label: "DMARC", tone: r.dmarc.tone, text: r.dmarc.verdict, tab: "mail" },
      {
        label: "DKIM", tab: "dkim",
        tone: dkimOn.length ? (dkimHalf.length ? "warning" : "success") : dkimHalf.length ? "warning" : "neutral",
        text: dkimOn.length || dkimHalf.length
          ? `${dkimOn.length} key${dkimOn.length === 1 ? "" : "s"} published${dkimHalf.length ? ` · ${dkimHalf.length} CNAME without key` : ""}`
          : "No common selectors found",
      },
      { label: "Microsoft 365", tab: "m365", tone: m365Off ? "warning" : m365Ok ? "success" : "neutral", text: `${m365Ok} of ${m365.length} records match${m365Off ? ` · ${m365Off} differ` : ""}` },
      { label: "Subdomains", tab: "subdomains", tone: dangling.length ? "error" : "success", text: dangling.length ? `${dangling.length} dangling CNAME${dangling.length > 1 ? "s" : ""}` : "No dangling CNAMEs" },
      { label: "Transport", tab: "security", tone: sec.length ? "success" : "neutral", text: sec.length ? sec.join(", ") : "No MTA-STS, TLS-RPT or BIMI" },
    ];
    if (failed) list.unshift({ label: "Lookups", tone: "error", text: `${failed} queries failed`, tab: "web" });
    return list;
  }

  /* ---------- mail-flow diagram ---------- */
  function domainMap(report) {
    const senders = report.senders.length ? report.senders : ["None identified"];
    const shown = senders.slice(0, 7);
    const more = senders.length - shown.length;
    const inbound = report.mxProviders.length ? report.mxProviders.slice(0, 4) : ["No MX"];
    const rows = Math.max(shown.length + (more ? 1 : 0), inbound.length, 3);
    const rowH = 34, top = 44, W = 760, H = top + rows * rowH + 96;
    const cx = W / 2, cy = top + (rows * rowH) / 2 - 6, boxW = 210, boxH = 92, leftX = 16, rightX = W - 16 - 190;
    const sy = (i, n) => cy - ((n - 1) * rowH) / 2 + i * rowH;
    const nL = shown.length + (more ? 1 : 0);
    const cs = getComputedStyle(document.documentElement);
    const c = (v) => cs.getPropertyValue(v).trim();
    const desc = `Sending services: ${senders.join(", ")}. Mail received by: ${inbound.join(", ")}. SPF ${report.spf.verdict}. DMARC ${report.dmarc.verdict}. DNS hosted at ${report.nsProviders.join(", ") || "unknown"}.`;

    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-labelledby": "map-t map-d" },
      s("title", { id: "map-t" }, `Mail flow for ${report.domain}`),
      s("desc", { id: "map-d" }, desc),
      s("defs", {}, s("marker", { id: "arrow", viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto" }, s("path", { d: "M0,0 L8,4 L0,8 z", fill: c("--primary") }))),
      s("text", { x: leftX, y: 24, fill: c("--muted-fg"), "font-size": 11, "font-weight": 600, "letter-spacing": 1 }, "SENDS AS THIS DOMAIN"),
      s("text", { x: rightX, y: 24, fill: c("--muted-fg"), "font-size": 11, "font-weight": 600, "letter-spacing": 1 }, "RECEIVES MAIL VIA"),
    );
    shown.forEach((name, i) => {
      const y = sy(i, nL), none = name === "None identified";
      svg.append(
        s("path", { d: `M ${leftX + 190} ${y} C ${cx - 150} ${y}, ${cx - 160} ${cy}, ${cx - boxW / 2} ${cy}`, fill: "none", stroke: none ? "#94a3ab" : c("--primary"), "stroke-width": 1.5, "stroke-dasharray": none ? "4 4" : null }),
        s("rect", { x: leftX, y: y - 13, width: 190, height: 26, rx: 6, fill: c("--bg"), stroke: c("--border") }),
        s("text", { x: leftX + 10, y: y + 4, "font-size": 12, fill: none ? c("--muted-fg") : c("--fg") }, clip(name, 26)),
      );
    });
    if (more > 0) svg.append(s("text", { x: leftX + 10, y: sy(nL - 1, nL) + 4, "font-size": 12, fill: c("--muted-fg") }, `+${more} more`));
    inbound.forEach((name, i) => {
      const y = sy(i, inbound.length), none = name === "No MX";
      svg.append(
        s("path", { d: `M ${cx + boxW / 2} ${cy} C ${cx + 160} ${cy}, ${cx + 150} ${y}, ${rightX} ${y}`, fill: "none", stroke: none ? "#dc2626" : c("--primary"), "stroke-width": 1.5, "stroke-dasharray": none ? "4 4" : null, "marker-end": "url(#arrow)" }),
        s("rect", { x: rightX, y: y - 13, width: 190, height: 26, rx: 6, fill: c("--bg"), stroke: c("--border") }),
        s("text", { x: rightX + 10, y: y + 4, "font-size": 12, fill: c("--fg") }, clip(name, 26)),
      );
    });
    svg.append(
      s("rect", { x: cx - boxW / 2, y: cy - boxH / 2, width: boxW, height: boxH, rx: 10, fill: c("--card"), stroke: c("--fg"), "stroke-width": 1.5 }),
      s("text", { x: cx, y: cy - 18, "text-anchor": "middle", "font-size": 14, "font-weight": 600, fill: c("--fg") }, clip(report.domain, 28)),
    );
    [
      { k: "SPF", t: report.spf.tone, v: report.spf.all || (report.spf.records.length ? "redirect" : "missing") },
      { k: "DMARC", t: report.dmarc.tone, v: report.dmarc.tags.p ? `p=${report.dmarc.tags.p}` : "missing" },
    ].forEach((row, i) => {
      svg.append(s("g", { transform: `translate(${cx - boxW / 2 + 14} ${cy + 2 + i * 22})` },
        s("circle", { cx: 5, cy: -4, r: 4.5, fill: "none", stroke: TONE_STROKE[row.t], "stroke-width": 3 }),
        s("text", { x: 16, y: 0, "font-size": 12, fill: c("--fg") }, s("tspan", { "font-weight": 600 }, row.k), `  ${row.v}`),
      ));
    });
    svg.append(s("line", { x1: 16, x2: W - 16, y1: H - 80, y2: H - 80, stroke: c("--border") }));
    [
      { k: "DNS HOSTED AT", v: report.nsProviders.join(", ") || "Unknown" },
      { k: "WEBSITE", v: report.websiteTargets.join(", ") || "No A record" },
    ].forEach((f, i) => {
      svg.append(s("g", { transform: `translate(${16 + i * 372} ${H - 52})` },
        s("text", { "font-size": 11, "font-weight": 600, "letter-spacing": 1, fill: c("--muted-fg") }, f.k),
        s("text", { y: 22, "font-size": 12, fill: c("--fg") }, clip(f.v, 56)),
      ));
    });
    return h("figure", {}, h("figcaption", {}, `Mail flow for ${report.domain}`), h("div", { class: "map" }, svg));
  }

  /* ---------- tables & panels ---------- */
  function ttlCell(r) {
    const line = (label, sec) => h("div", { class: "val ttl", title: `${sec} seconds` }, label ? h("span", { class: "muted" }, `${label} `) : null, A.formatTtl(sec));
    const out = [];
    if (r.cnameTtls && r.cnameTtls.length) out.push(line("CNAME", Math.min(...r.cnameTtls)));
    const vt = (r.ttls || []).filter((_, i) => !(r.type === "CNAME" && r.cnames.includes(r.values[i])));
    if (vt.length) out.push(line(out.length ? r.type : "", Math.min(...vt)));
    return out.length ? out : h("span", { class: "val muted" }, "—");
  }

  function resultsTable(rows, caption) {
    const visible = state.showEmpty ? rows : rows.filter((r) => r.values.length || r.cnames.length || r.tone === "error");
    const hidden = rows.filter((r) => !visible.includes(r));
    const table = h("table", {},
      h("caption", { class: "sr-only" }, caption),
      h("thead", {}, h("tr", {},
        h("th", { scope: "col", class: "w-name" }, "Name"), h("th", { scope: "col", class: "w-type" }, "Type"),
        h("th", { scope: "col" }, "Records"),
        h("th", { scope: "col", class: "w-ttl", title: "Time to live: how long the resolver will keep serving this answer from its cache" }, "TTL"),
        h("th", { scope: "col", class: "w-res" }, "Result"))),
      h("tbody", {}, visible.map((r) => h("tr", {},
        h("td", {}, h("div", { class: "val" }, r.name), h("div", { class: "sub" }, r.service ? `${r.label} · ${r.service}` : r.label)),
        h("td", { class: "val" }, r.type),
        h("td", {},
          r.cnames.map((cn) => h("div", { class: "val" }, h("span", { class: "muted" }, "CNAME → "), cn)),
          r.values.filter((v) => !(r.type === "CNAME" && r.cnames.includes(v))).map((v) => h("div", { class: "val", title: v.length > 160 ? v : null }, clip(v, 160))),
          !r.values.length && !r.cnames.length ? h("span", { class: "val muted" }, r.status === -1 ? (r.error || "—") : A.statusText(r.status)) : null,
        ),
        h("td", {}, ttlCell(r)),
        h("td", {}, badge(r.tone, r.verdict)),
      ))),
    );
    return h("div", {}, table,
      hidden.length ? h("p", { class: "small muted" }, `${hidden.length} not found: `, h("span", { class: "mono" }, hidden.map((r) => r.label).join(", "))) : null);
  }

  function spfPanel(report) {
    const { spf, dmarc } = report;
    return h("div", { class: "cards2" },
      h("section", { class: "card", "aria-labelledby": "spf-h" },
        h("div", { class: "top" }, h("h3", { id: "spf-h" }, "SPF"), badge(spf.tone, spf.verdict)),
        spf.records.map((r) => h("p", { class: "code" }, r)),
        spf.records.length ? h("p", { class: "small" }, "DNS lookups: ", h("strong", {}, `${spf.lookups} of 10`)) : null,
        spf.includes.length ? h("ul", { class: "incl" }, spf.includes.map((i) => h("li", {}, h("span", { class: "mono" }, i.domain), h("span", {}, i.service || "Unrecognised")))) : null,
      ),
      h("section", { class: "card", "aria-labelledby": "dmarc-h" },
        h("div", { class: "top" }, h("h3", { id: "dmarc-h" }, "DMARC"), badge(dmarc.tone, dmarc.verdict)),
        dmarc.records.map((r) => h("p", { class: "code" }, r)),
        Object.keys(dmarc.tags).length
          ? h("dl", { class: "kv" }, Object.entries(dmarc.tags).filter(([k]) => k !== "v").flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, v)]))
          : null,
      ),
    );
  }

  function verifyPanel(report) {
    if (!report.verifications.length) return h("p", { class: "muted" }, `No recognised verification tokens on ${report.domain} or www.${report.domain}.`);
    return h("table", {},
      h("caption", { class: "sr-only" }, "Verification tokens"),
      h("thead", {}, h("tr", {}, h("th", { scope: "col", class: "w-svc" }, "Service"), h("th", { scope: "col" }, "Token"))),
      h("tbody", {}, report.verifications.map((v) => h("tr", {}, h("td", {}, h("strong", {}, v.service)), h("td", { class: "val" }, v.value)))));
  }

  /* ---------- render ---------- */
  function intro() {
    return h("div", { class: "intro" }, [
      ["Mail & authentication", "MX, SPF with recursive lookup count, DMARC policy and tags"],
      ["Microsoft 365", "Autodiscover, Intune enrollment, Entra registration, Teams SIP and SRV"],
      ["Sending services", `${A.DKIM_SELECTORS.length} DKIM selectors: M365, Google, SendGrid, Mailchimp, Mailgun, Brevo and more`],
      ["Website & subdomains", "A, AAAA, NS, SOA, CAA, verification tokens and dangling CNAMEs"],
    ].map(([t, b]) => h("div", {}, h("h2", {}, t), h("p", {}, b))));
  }

  function render() {
    const root = $("results");
    root.replaceChildren();
    const report = state.report;
    if (!report) { root.append(intro()); return; }

    root.append(h("div", { class: "head" },
      h("h1", {}, h("span", { class: "mono" }, report.domain), h("span", { class: "meta" }, `${report.queryCount} queries · ${A.resolverLabel(report.resolver)} · ${new Date(report.ranAt).toLocaleString()}`)),
      h("div", { class: "actions" },
        h("button", { class: "btn sm primary", type: "button", onclick: healthReport }, "Domain Health report"),
        h("button", { class: "btn sm", type: "button", onclick: exportCsv }, "Export CSV"))));

    root.append(h("div", { class: "overview" },
      domainMap(report),
      h("section", { "aria-labelledby": "findings-h" },
        h("h2", { id: "findings-h", class: "h2" }, "Findings"),
        h("ul", { class: "findings" }, findings(report).map((f) => h("li", {},
          h("button", { type: "button", onclick: () => { state.tab = f.tab; render(); $(`tab-${f.tab}`).focus(); } },
            h("span", { class: "k" }, f.label), badge(f.tone, f.text))))))));

    const tabs = h("div", { class: "tabs", role: "tablist", "aria-label": "Record groups" },
      A.GROUPS.map((g) => h("button", {
        type: "button", role: "tab", id: `tab-${g.id}`, "aria-selected": String(state.tab === g.id), "aria-controls": "tabpanel",
        tabindex: state.tab === g.id ? "0" : "-1",
        onclick: () => { state.tab = g.id; render(); $(`tab-${g.id}`).focus(); },
        onkeydown: (e) => {
          const i = A.GROUPS.findIndex((x) => x.id === state.tab);
          const n = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
          if (!n) return;
          e.preventDefault();
          state.tab = A.GROUPS[(i + n + A.GROUPS.length) % A.GROUPS.length].id;
          render(); $(`tab-${state.tab}`).focus();
        },
      }, g.label)));
    const toggle = h("label", { class: "toggle" },
      h("input", { type: "checkbox", checked: state.showEmpty, onchange: (e) => { state.showEmpty = e.target.checked; render(); } }),
      "Show not found");
    root.append(h("div", { class: "tabsbar" }, tabs, toggle));

    const g = A.GROUPS.find((x) => x.id === state.tab);
    const panel = h("div", { class: "panel", role: "tabpanel", id: "tabpanel", "aria-labelledby": `tab-${g.id}` });
    if (g.id === "mail") panel.append(spfPanel(report));
    if (g.id === "verify") {
      panel.append(verifyPanel(report), h("h3", { class: "h2" }, "All TXT records"),
        resultsTable(report.results.filter((r) => r.id === "root-txt" || r.id === "www-txt"), "All TXT records"));
    } else {
      panel.append(resultsTable(report.results.filter((r) => r.group === g.id), g.label));
    }
    root.append(panel);
  }

  async function healthReport() {
    if (!state.report) return;
    const R = window.DnsHealthReport;
    try {
      const html = R.buildHtml(state.report, A, window.DNS_LOGO);
      const p = await window.dnsApi.saveFile(R.fileName(state.report), html);
      if (p) toast(`Saved ${p}`);
    } catch { toast("Could not create the report"); }
  }
  async function exportCsv() {
    if (!state.report) return;
    const name = `dns-${state.report.domain}-${state.report.ranAt.slice(0, 10)}.csv`;
    try { const p = await window.dnsApi.saveFile(name, A.toCsv(state.report)); if (p) toast(`Downloaded ${p}`); }
    catch { toast("Could not save the file"); }
  }

  $("copy-year").textContent = String(new Date().getFullYear());
  render();
  $("domain").focus();
})();

</script>
</body>
</html>
